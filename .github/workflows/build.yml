name: Build SettingsHide rootless
on:
  workflow_dispatch:
jobs:
  package:
    runs-on: macos-15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: brew install make ldid dpkg
      - name: Install Theos
        run: |
          git clone --recursive --depth 1 https://github.com/theos/theos.git "$RUNNER_TEMP/theos"
          echo "THEOS=$RUNNER_TEMP/theos" >> "$GITHUB_ENV"
          echo "$(brew --prefix make)/libexec/gnubin" >> "$GITHUB_PATH"
      - name: Install patched Preferences link stubs
        run: |
          curl -fL --retry 3 -o "$RUNNER_TEMP/ios16-sdk.tar.xz" https://github.com/theos/sdks/releases/download/master-146e41f/iPhoneOS16.5.sdk.tar.xz
          mkdir -p "$THEOS/sdks"
          tar -xf "$RUNNER_TEMP/ios16-sdk.tar.xz" -C "$THEOS/sdks"
          test -f "$THEOS/sdks/iPhoneOS16.5.sdk/System/Library/PrivateFrameworks/Preferences.framework/Preferences.tbd"
      - name: Validate project files
        run: |
          plutil -lint -s BatteryHide.plist prefs/Resources/Info.plist prefs/Resources/Root.plist prefs/Resources/Apps.plist layout/Library/PreferenceLoader/Preferences/BatteryHide.plist
          test -f Tweak.x && test -f prefs/BHRootController.m
      - name: Build package
        run: make package FINALPACKAGE=1
      - uses: actions/upload-artifact@v4
        with:
          name: SettingsHide-rootless
          path: packages/*.deb
          if-no-files-found: error
